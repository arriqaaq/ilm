  <text x="90" y="156" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="600" letter-spacing="0.5" fill="#9ca3af">GENERATION</text>
  <text x="90" y="168" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#1a1a2e">Tabi'i</text>

  <rect x="140" y="144" width="100" height="28" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="190" y="156" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="600" letter-spacing="0.5" fill="#9ca3af">HADITHS</text>
  <text x="190" y="168" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#1a1a2e">2,217</text>

  <rect x="50" y="180" width="80" height="28" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="90" y="192" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="600" letter-spacing="0.5" fill="#9ca3af">TEACHERS</text>
  <text x="90" y="204" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#1a1a2e">48</text>

  <rect x="140" y="180" width="100" height="28" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="190" y="192" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="600" letter-spacing="0.5" fill="#9ca3af">STUDENTS</text>
  <text x="190" y="204" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#1a1a2e">136</text>

