  </defs>

  <!-- Main card -->
  <rect x="20" y="20" width="660" height="280" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" filter="url(#shadow)"/>

  <!-- Tab bar -->
  <rect x="20" y="20" width="660" height="38" rx="12" fill="#faf8f5"/>
  <rect x="20" y="46" width="660" height="12" fill="#faf8f5"/>

  <text x="60" y="44" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#9ca3af">Network</text>
  <text x="140" y="44" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#9ca3af">Hadiths</text>
  <text x="220" y="44" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#9ca3af">Connections</text>
  <text x="332" y="44" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#c8a96a">Read Bio</text>
  <line x1="318" y1="52" x2="378" y2="52" stroke="#c8a96a" stroke-width="2.5" stroke-linecap="round"/>
  <text x="420" y="44" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#9ca3af">Details</text>

  <!-- Left column: narrator info -->
  <rect x="34" y="66" width="220" height="222" rx="8" fill="#faf8f5"/>

  <!-- Arabic name -->
  <text x="144" y="94" text-anchor="middle" font-family="'Traditional Arabic', 'Noto Naskh Arabic', serif" font-size="16" font-weight="700" fill="#1a1a2e">&#x0627;&#x0644;&#x0632;&#x0651;&#x064F;&#x0647;&#x0652;&#x0631;&#x0650;&#x064A;</text>
  <!-- English name -->
  <text x="144" y="114" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#4a4a68">az-Zuhri</text>
  <text x="144" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#9ca3af">Muhammad ibn Shihab</text>

