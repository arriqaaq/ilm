  <rect x="268" y="66" width="400" height="32" rx="8" fill="#faf8f5"/>
  <rect x="268" y="86" width="400" height="12" fill="#faf8f5"/>
  <text x="288" y="88" font-family="system-ui, sans-serif" font-size="9" font-weight="700" letter-spacing="1.5" fill="#c8a96a">TAHDHIB AL-TAHDHIB</text>
  <text x="630" y="88" text-anchor="end" font-family="ui-monospace, monospace" font-size="9" fill="#9ca3af">Vol. 9 / p. 395</text>

  <!-- Bio Arabic text -->
  <text x="648" y="122" text-anchor="end" font-family="'Traditional Arabic', 'Noto Naskh Arabic', serif" font-size="14" fill="#1a1a2e">&#x0645;&#x062D;&#x0645;&#x062F; &#x0628;&#x0646; &#x0645;&#x0633;&#x0644;&#x0645; &#x0628;&#x0646; &#x0639;&#x0628;&#x064A;&#x062F; &#x0627;&#x0644;&#x0644;&#x0647; &#x0628;&#x0646; &#x0634;&#x0647;&#x0627;&#x0628;</text>
  <text x="648" y="142" text-anchor="end" font-family="'Traditional Arabic', 'Noto Naskh Arabic', serif" font-size="14" fill="#1a1a2e">&#x0627;&#x0644;&#x0632;&#x0647;&#x0631;&#x064A; &#x0623;&#x0628;&#x0648; &#x0628;&#x0643;&#x0631; &#x0627;&#x0644;&#x0642;&#x0631;&#x0634;&#x064A;</text>

