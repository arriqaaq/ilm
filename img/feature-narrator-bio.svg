  <rect x="288" y="158" width="360" height="7" rx="2" fill="#e5e7eb" opacity="0.5"/>
  <rect x="288" y="172" width="340" height="7" rx="2" fill="#e5e7eb" opacity="0.5"/>
  <rect x="288" y="186" width="350" height="7" rx="2" fill="#e5e7eb" opacity="0.5"/>
  <rect x="288" y="200" width="320" height="7" rx="2" fill="#e5e7eb" opacity="0.5"/>
  <rect x="288" y="214" width="355" height="7" rx="2" fill="#e5e7eb" opacity="0.5"/>
  <rect x="288" y="228" width="300" height="7" rx="2" fill="#e5e7eb" opacity="0.5"/>

  <!-- Page navigation -->
  <line x1="268" y1="254" x2="668" y2="254" stroke="#e5e7eb" stroke-width="1"/>
  <text x="298" y="276" font-family="system-ui, sans-serif" font-size="10" fill="#c8a96a" font-weight="600">&#9664; Prev</text>
  <text x="468" y="276" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#9ca3af">Entry #395</text>
  <text x="638" y="276" text-anchor="end" font-family="system-ui, sans-serif" font-size="10" fill="#c8a96a" font-weight="600">Next &#9654;</text>
