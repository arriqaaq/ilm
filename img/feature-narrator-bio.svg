  <rect x="50" y="216" width="190" height="28" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="145" y="228" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="600" letter-spacing="0.5" fill="#9ca3af">DEATH</text>
  <text x="145" y="240" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#1a1a2e">124 AH / 742 CE</text>

