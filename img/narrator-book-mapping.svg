<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Left: Variant names -->
  <rect x="20" y="20" width="180" height="180" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" filter="url(#shadow)"/>
  <text x="110" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="700" letter-spacing="1.5" fill="#c8a96a">VARIANT FORMS</text>

  <text x="110" y="68" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#1a1a2e" direction="rtl">&#x0645;&#x064F;&#x062D;&#x064E;&#x0645;&#x0651;&#x064E;&#x062F;&#x064C; &#x0628;&#x0652;&#x0646;&#x064F; &#x0634;&#x0650;&#x0647;&#x064E;&#x0627;&#x0628;&#x064D;</text>
  <text x="110" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#1a1a2e" direction="rtl">&#x0645;&#x062D;&#x0645;&#x062F; &#x0628;&#x0646; &#x0634;&#x0647;&#x0627;&#x0628;</text>
  <text x="110" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#1a1a2e" direction="rtl">&#x0645;&#x062D;&#x0645;&#x062F; &#x0628;&#x0646; &#x0645;&#x0633;&#x0644;&#x0645;</text>
  <text x="110" y="134" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#1a1a2e" direction="rtl">&#x0623;&#x0628;&#x0648; &#x0628;&#x0643;&#x0631; &#x0627;&#x0644;&#x0632;&#x0647;&#x0631;&#x064A;</text>

  <!-- Normalization steps -->
  <text x="110" y="162" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#9ca3af">Strip diacritics (0x064B-065F)</text>
  <text x="110" y="174" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#9ca3af">&#x0623;/&#x0625;/&#x0622; &#8594; &#x0627;  &#183;  &#x0629; &#8594; &#x0647;  &#183;  &#x0649; &#8594; &#x064A;</text>
  <text x="110" y="190" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#9ca3af">&#x0627;&#x0628;&#x064A; &#8594; &#x0627;&#x0628;&#x0648; (kunya case)</text>

  <!-- Funnel arrow -->
  <line x1="200" y1="110" x2="248" y2="110" stroke="#c8a96a" stroke-width="2" opacity="0.5"/>
  <circle cx="200" cy="110" r="3" fill="#c8a96a"/>
  <circle cx="248" cy="110" r="3" fill="#c8a96a"/>

  <!-- Center: Canonical form -->
  <rect x="258" y="86" width="160" height="48" rx="12" fill="rgba(200,169,106,0.08)" stroke="#c8a96a" stroke-width="1"/>
  <text x="338" y="106" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#c8a96a">CANONICAL FORM</text>
  <text x="338" y="124" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1a1a2e" direction="rtl">&#x0645;&#x062D;&#x0645;&#x062F; &#x0628;&#x0646; &#x0634;&#x0647;&#x0627;&#x0628;</text>

  <!-- Arrow to tiers -->
  <line x1="418" y1="110" x2="448" y2="110" stroke="#c8a96a" stroke-width="2" opacity="0.5"/>
  <circle cx="418" cy="110" r="3" fill="#c8a96a"/>
  <circle cx="448" cy="110" r="3" fill="#c8a96a"/>

  <!-- Right: Three matching tiers -->
  <rect x="458" y="20" width="222" height="216" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" filter="url(#shadow)"/>
  <text x="569" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="700" letter-spacing="1.5" fill="#c8a96a">MATCHING TIERS</text>

  <!-- Tier 1 -->
  <rect x="472" y="52" width="194" height="36" rx="8" fill="rgba(22,163,74,0.06)" stroke="rgba(22,163,74,0.2)" stroke-width="1"/>
  <text x="482" y="68" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#16a34a">Tier 1</text>
  <text x="532" y="68" font-family="system-ui, sans-serif" font-size="10" fill="#4a4a68">Exact full name</text>
  <rect x="604" y="56" width="52" height="14" rx="4" fill="rgba(22,163,74,0.1)"/>
  <text x="630" y="66" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" font-weight="600" fill="#16a34a">HIGHEST</text>
  <text x="482" y="82" font-family="system-ui, sans-serif" font-size="8" fill="#9ca3af">Full normalized name matches exactly</text>

  <!-- Tier 2 -->
  <rect x="472" y="96" width="194" height="36" rx="8" fill="rgba(22,163,74,0.04)" stroke="rgba(22,163,74,0.15)" stroke-width="1"/>
  <text x="482" y="112" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#16a34a">Tier 2</text>
  <text x="532" y="112" font-family="system-ui, sans-serif" font-size="10" fill="#4a4a68">4+ word prefix</text>
  <rect x="618" y="100" width="38" height="14" rx="4" fill="rgba(22,163,74,0.08)"/>
  <text x="637" y="110" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" font-weight="600" fill="#16a34a">HIGH</text>
  <text x="482" y="126" font-family="system-ui, sans-serif" font-size="8" fill="#9ca3af">First 4+ name parts match</text>

  <!-- Tier 3 -->
  <rect x="472" y="140" width="194" height="36" rx="8" fill="rgba(200,169,106,0.06)" stroke="rgba(200,169,106,0.15)" stroke-width="1"/>
  <text x="482" y="156" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#c8a96a">Tier 3</text>
  <text x="532" y="156" font-family="system-ui, sans-serif" font-size="10" fill="#4a4a68">3-word unique</text>
  <rect x="612" y="144" width="46" height="14" rx="4" fill="rgba(200,169,106,0.08)"/>
  <text x="635" y="154" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" font-weight="600" fill="#c8a96a">MEDIUM</text>
  <text x="482" y="170" font-family="system-ui, sans-serif" font-size="8" fill="#9ca3af">Only if 3-word prefix is unambiguous</text>

  <!-- Skipped -->
  <rect x="472" y="184" width="194" height="36" rx="8" fill="rgba(153,27,27,0.04)" stroke="rgba(153,27,27,0.15)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="482" y="200" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#991b1b" text-decoration="line-through">Skip</text>
  <text x="522" y="200" font-family="system-ui, sans-serif" font-size="10" fill="#4a4a68">Ambiguous 3-word</text>
  <text x="482" y="214" font-family="system-ui, sans-serif" font-size="8" fill="#9ca3af">Better no mapping than wrong mapping</text>

  <!-- Bottom: Coverage stats -->
  <rect x="20" y="254" width="660" height="48" rx="12" fill="#faf8f5" stroke="#e5e7eb" stroke-width="1"/>

  <rect x="40" y="264" width="140" height="28" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="110" y="276" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#9ca3af">TAHDHIB ENTRIES</text>
  <text x="110" y="290" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#1a1a2e">7,844</text>

  <text x="210" y="282" font-family="system-ui, sans-serif" font-size="14" fill="#c8a96a">&#8594;</text>

  <rect x="240" y="264" width="140" height="28" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="310" y="276" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#9ca3af">MATCHED</text>
  <text x="310" y="290" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#16a34a">~6,500</text>

  <text x="410" y="282" font-family="system-ui, sans-serif" font-size="14" fill="#c8a96a">=</text>

  <rect x="440" y="264" width="220" height="28" rx="6" fill="rgba(22,163,74,0.08)" stroke="rgba(22,163,74,0.2)" stroke-width="1"/>
  <text x="550" y="282" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#16a34a">91%+ coverage</text>
</svg>