<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#1a1a2e">Mapping 7,563 Bukhari Hadiths &#8594; Fath al-Bari Pages</text>

  <!-- Three method columns -->
  <!-- Method 1: Direct Markers -->
  <rect x="20" y="50" width="210" height="180" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" filter="url(#shadow)"/>
  <text x="125" y="72" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="700" letter-spacing="1.5" fill="#c8a96a">METHOD 1</text>
  <text x="125" y="92" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#1a1a2e">Direct Markers</text>

  <!-- Scan illustration -->
  <rect x="40" y="106" width="170" height="30" rx="6" fill="#1a1a2e"/>
  <text x="125" y="125" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#e2e8f0">[&#x0627;&#x0644;&#x062D;&#x062F;&#x064A;&#x062B; N]</text>

  <text x="125" y="156" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#4a4a68">Scan page text for</text>
  <text x="125" y="170" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#4a4a68">hadith number markers</text>

  <!-- Count badge -->
  <rect x="60" y="190" width="120" height="28" rx="8" fill="rgba(22,163,74,0.08)" stroke="rgba(22,163,74,0.2)" stroke-width="1"/>
  <text x="120" y="209" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#16a34a">~1,620</text>

  <!-- Method 2: باب Alignment -->
  <rect x="245" y="50" width="210" height="180" rx="12" fill="#ffffff" stroke="#c8a96a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="350" y="72" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="700" letter-spacing="1.5" fill="#c8a96a">METHOD 2</text>
  <text x="350" y="92" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#1a1a2e">&#x0628;&#x0627;&#x0628; Alignment</text>

  <!-- Alignment illustration -->
  <rect x="260" y="106" width="80" height="22" rx="4" fill="#faf8f5" stroke="#e5e7eb" stroke-width="1"/>
  <text x="300" y="121" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#4a4a68">Bukhari &#x0628;&#x0627;&#x0628;</text>
  <text x="350" y="121" font-family="system-ui, sans-serif" font-size="10" fill="#c8a96a">&#8596;</text>
  <rect x="360" y="106" width="80" height="22" rx="4" fill="#faf8f5" stroke="#e5e7eb" stroke-width="1"/>
  <text x="400" y="121" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#4a4a68">Fath &#x0628;&#x0627;&#x0628;</text>

  <text x="350" y="150" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#4a4a68">Match sequential chapter</text>
  <text x="350" y="164" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#4a4a68">headings by order</text>

  <!-- Count badge (largest) -->
  <rect x="285" y="190" width="120" height="28" rx="8" fill="rgba(22,163,74,0.08)" stroke="rgba(22,163,74,0.2)" stroke-width="1"/>
  <text x="345" y="209" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#16a34a">~5,165</text>

  <!-- Method 3: Interpolation -->
  <rect x="470" y="50" width="210" height="180" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" filter="url(#shadow)"/>
  <text x="575" y="72" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="700" letter-spacing="1.5" fill="#c8a96a">METHOD 3</text>
  <text x="575" y="92" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#1a1a2e">Interpolation</text>

  <!-- Gap-fill illustration -->
  <circle cx="510" cy="120" r="8" fill="#16a34a" opacity="0.2" stroke="#16a34a" stroke-width="1"/>
  <text x="510" y="124" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#16a34a">H5</text>
  <line x1="518" y1="120" x2="538" y2="120" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3,2"/>
  <circle cx="545" cy="120" r="8" fill="#fecaca" stroke="#991b1b" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="545" y="124" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#991b1b">H6</text>
  <line x1="553" y1="120" x2="573" y2="120" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3,2"/>
  <circle cx="580" cy="120" r="8" fill="#fecaca" stroke="#991b1b" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="580" y="124" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#991b1b">H7</text>
  <line x1="588" y1="120" x2="608" y2="120" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3,2"/>
  <circle cx="615" cy="120" r="8" fill="#16a34a" opacity="0.2" stroke="#16a34a" stroke-width="1"/>
  <text x="615" y="124" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#16a34a">H8</text>

  <text x="575" y="150" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#4a4a68">Assign unmapped hadiths</text>
  <text x="575" y="164" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#4a4a68">to nearest preceding page</text>

  <!-- Count badge -->
  <rect x="510" y="190" width="120" height="28" rx="8" fill="rgba(200,169,106,0.08)" stroke="rgba(200,169,106,0.2)" stroke-width="1"/>
  <text x="570" y="209" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#c8a96a">~779</text>

  <!-- Bottom: hadith_sharh_map table -->
  <rect x="60" y="248" width="580" height="80" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" filter="url(#shadow)"/>
  <text x="350" y="268" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#c8a96a">hadith_sharh_map</text>

  <!-- Table header -->
  <rect x="76" y="278" width="548" height="18" fill="#faf8f5"/>
  <text x="120" y="290" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" font-weight="600" fill="#4a4a68">hadith_number</text>
  <text x="230" y="290" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" font-weight="600" fill="#4a4a68">collection_id</text>
  <text x="340" y="290" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" font-weight="600" fill="#4a4a68">book_id</text>
  <text x="450" y="290" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" font-weight="600" fill="#4a4a68">page_index</text>
  <text x="560" y="290" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" font-weight="600" fill="#4a4a68">context</text>

  <!-- Sample row -->
  <text x="120" y="310" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#1a1a2e">1</text>
  <text x="230" y="310" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#1a1a2e">1 (Bukhari)</text>
  <text x="340" y="310" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#1a1a2e">1673 (Fath)</text>
  <text x="450" y="310" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" font-weight="700" fill="#c8a96a">142</text>
  <text x="560" y="310" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#9ca3af">null</text>

  <!-- Coverage bar -->
  <rect x="150" y="344" width="400" height="24" rx="12" fill="#f3f4f6"/>
  <rect x="150" y="344" width="400" height="24" rx="12" fill="rgba(22,163,74,0.15)"/>
  <text x="350" y="360" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#16a34a">100% of Bukhari mapped (7,563 hadiths)</text>
</svg>